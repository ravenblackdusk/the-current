<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.main %}{{ site.title }}: {{ site.subtitle }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>
<meta name="author" content="{{ site.author }}">
<link rel="license" href="https://creativecommons.org/licenses/by/4.0/">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
<script src="{{ '/theme.js' | relative_url }}"></script>
</head>
<body>
<main>
<button class="theme-toggle" type="button" aria-label="Dark theme" hidden>
<svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
<svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>
{% if page.main %}
<header class="masthead">
<img class="hero" src="{{ '/the-current.webp' | relative_url }}" width="1254" height="1254" alt="Glowing blue branches rise from a single point at the base of a dark planet, splitting and reaching upward, with the light of a star at the horizon.">
<h1>{{ site.title }}</h1>
<p class="subtitle">{{ site.subtitle }}</p>
<p class="byline">{{ site.author }}</p>
</header>
{% else %}
<nav class="back"><a href="{{ '/' | relative_url }}">← {{ site.title }}</a></nav>
<p class="byline">{{ site.author }}</p>
{% endif %}
<article>
{{ content }}
</article>
</main>
<footer>
<p>© {{ 'now' | date: '%Y' }} {{ site.author }}. Licensed under <a rel="license" href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>.</p>
</footer>
</body>
</html>
